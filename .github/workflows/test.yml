name: R and Python tests (not Stata parity)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install demo dependencies
        run: Rscript --vanilla -e 'dir.create(".r-library"); install.packages("sandwich", lib=".r-library", repos="https://cloud.r-project.org")'
      - name: Python comparison and runner tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: R semantics and independent matrix checks
        run: Rscript --vanilla tests/test_r.R
      - name: End-to-end R-only run
        run: python3 scripts/run_demo.py --r-only --out runs/ci
